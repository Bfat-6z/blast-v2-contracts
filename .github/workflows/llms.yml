name: llms

on:
  push:
    branches: [main]
    paths: ['sui/**', 'docs/llms/**', 'deployments/**', 'scripts/gen_llms.py', 'scripts/test_gen_llms.py', 'llms-full.txt', 'llms/**', '.github/workflows/llms.yml']
  pull_request:
    paths: ['sui/**', 'docs/llms/**', 'deployments/**', 'scripts/gen_llms.py', 'scripts/test_gen_llms.py', 'llms-full.txt', 'llms/**', '.github/workflows/llms.yml']

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUI_RELEASE: mainnet-v1.77.2
      CARGO_BUILD_JOBS: 1
      RAYON_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # Deployment status compares each package with the commit it was published from.
          fetch-depth: 0
      - name: Install pinned Sui CLI
        run: |
          curl -fsSL -o sui.tgz \
            "https://github.com/MystenLabs/sui/releases/download/${SUI_RELEASE}/sui-${SUI_RELEASE}-ubuntu-x86_64.tgz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf sui.tgz -C "$HOME/.local/bin" ./sui
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Fetch source revisions recorded for current publications
        run: |
          python3 - <<'PYCODE'
          import json
          import subprocess
          import sys
          import tomllib
          from pathlib import Path
          sys.path.insert(0, "scripts")
          from gen_llms import PACKAGES
          published = set()
          for package, _ in PACKAGES:
              path = Path(package) / "Published.toml"
              if path.exists():
                  entry = tomllib.loads(path.read_text()).get("published", {}).get("mainnet")
                  if entry:
                      published.add(entry["published-at"])
          for path in Path("deployments/sui/mainnet").glob("*.json"):
              text = path.read_text()
              data = json.loads(text)
              kind = str(data.get("recordKind", ""))
              commit = (data.get("repository") or {}).get("commit")
              if not commit or data.get("status") != "success" or "deployment" not in kind or "rehearsal" in kind:
                  continue
              if not any(address in text for address in published):
                  continue
              present = subprocess.run(["git", "cat-file", "-e", f"{commit}^{{commit}}"], stderr=subprocess.DEVNULL)
              if present.returncode:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", commit], check=True)
          PYCODE
      - name: Test summary identity handling
        run: python3 scripts/test_gen_llms.py
      - name: Check llms-full.txt and llms/ are current
        run: python3 scripts/gen_llms.py --check
      - name: Reject omitted fill proofs with the pinned compiler
        run: bash sui/boosts/aftermath_adapter/scripts/verify.sh fill-proof
