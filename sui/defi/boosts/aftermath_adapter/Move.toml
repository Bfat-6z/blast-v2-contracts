[package]
name = "blast_boosts_aftermath"
edition = "2024"
license = "BUSL-1.1"
authors = ["Jose Cerqueira (jose@interestprotocol.com)"]

[dependencies]
# Pre-fold administration for this source lineage (issue #223).
blast_admin = { git = "https://github.com/interest-protocol/blast-v2-contracts.git", subdir = "sui/admin", rev = "c4b86a9f3b1fcfb0d4a7b4e9a3d07e2fa78901f3" }
blast_boosts_core = { local = "../core" }
# Partners must resolve the same admin as the adapter and core.
blast_partners = { git = "https://github.com/interest-protocol/blast-v2-contracts.git", subdir = "sui/partners", rev = "c4b86a9f3b1fcfb0d4a7b4e9a3d07e2fa78901f3" }
# Verbatim copy of AftermathFinance/move-interfaces at f62e74aa862ef65b8950a70d83aac8cb71c19837
# (see interfaces/aftermath/README.md); check_mainnet_abi.mjs gates it against mainnet.
perpetuals = { local = "interfaces/aftermath/iperps/perpetuals" }
position = { local = "interfaces/aftermath/iperps/position" }
authority_cap = { local = "interfaces/aftermath/authority-cap/authority-cap" }
oracle_aggregator = { local = "interfaces/aftermath/oracle-aggregator/oracle-aggregator" }
ifixed = { local = "interfaces/aftermath/ifixed/ifixed" }

[addresses]
blast_boosts_aftermath = "0x0"
